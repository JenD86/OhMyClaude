<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Oh My Claude studio</title>
<link rel="stylesheet" href="assets/fonts/fonts.css">
<style>
  html, body { margin: 0; background: #0A0911; color: #eee; font: 13px system-ui, sans-serif; }
  main { padding: 12px; display: grid; gap: 8px; }
  #out { width: min(100%, 1280px); aspect-ratio: 16 / 9; height: auto; background: #000; }
  .bar { display: flex; gap: 10px; align-items: center; max-width: 1280px; }
  #scrub { flex: 1; }
  #tt { font-variant-numeric: tabular-nums; min-width: 220px; }
</style>
</head>
<body>
<main>
  <canvas id="out" width="1920" height="1080"></canvas>
  <div class="bar"><button id="play">play</button><input id="scrub" type="range" min="0" max="128.5" step="0.0333" value="0"><span id="tt">loading…</span></div>
  <audio id="song" src="assets/song.mp3" preload="auto"></audio>
</main>
<script src="src/core.js"></script>
<script src="src/fx.js"></script>
<script src="src/lyrics.js"></script>
<script src="src/timeline.js"></script>
<script>const CAST = {};  // shared between chapters (e.g. motifs the finale reprises)</script>
<!-- chapters -->
<script src="src/ch/c00_open.js"></script>
<script src="src/ch/c01_chorus1.js"></script>
<script src="src/ch/c02_verse1.js"></script>
<script src="src/ch/c03_verse2.js"></script>
<script src="src/ch/c04_verse3.js"></script>
<script src="src/ch/c05_chorus3.js"></script>
<script src="src/ch/c06_akhnai.js"></script>
<script src="src/ch/c07_dajjal.js"></script>
<script src="src/ch/c08_veritas.js"></script>
<script src="src/ch/c09_loss.js"></script>
<script src="src/ch/c10_finale.js"></script>
<script>
  boot().then(() => {
    if (location.search.includes('render')) return;
    const scrub = document.getElementById('scrub'), tt = document.getElementById('tt'), song = document.getElementById('song');
    const show = t => { renderFrame(t); const l = lineAt(t), c = CH.find(c => t >= c.start && t < c.end); tt.textContent = `${t.toFixed(2)}s  bar ${barN(t)}.${((beatN(t) % 4) + 4) % 4}  ${c ? c.name : '—'}`; };
    scrub.oninput = () => { song.currentTime = +scrub.value; show(+scrub.value); };
    document.getElementById('play').onclick = () => song.paused ? song.play() : song.pause();
    const loop = () => { if (!song.paused) { scrub.value = song.currentTime; show(song.currentTime); } requestAnimationFrame(loop); };
    show(+(new URLSearchParams(location.search).get('t') || 0)); loop();
  });
</script>
</body>
</html>
